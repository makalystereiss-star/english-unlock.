<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>English Unlock</title><style> *{box-sizing:border-box}body{margin:0;background:#f8f7fc;color:#29243b;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:650px;margin:auto;padding:22px 18px 100px}h1{font-size:32px;margin:8px 0}h2{font-size:23px}p{line-height:1.5}small{color:#625b76}button,input,select{font:inherit}button{border:0;border-radius:15px;padding:14px;background:#e8dff8;color:#30254d;cursor:pointer;min-height:48px}button.primary{background:#59449a;color:white;width:100%}button:disabled{opacity:.5}section{background:white;border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #32245a09}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{text-align:left;min-height:80px}.bar{height:10px;background:#eee8f7;border-radius:20px;overflow:hidden}.bar b{display:block;height:100%;background:#8066bc}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));gap:4px;border-top:1px solid #eee}nav button{background:white;font-size:13px;padding:10px}.phrase{font-size:25px;font-weight:700;line-height:1.4}.stack{display:grid;gap:10px}input,select{width:100%;padding:13px;border:1px solid #d9d1e8;border-radius:12px;background:white}.ok{color:#176447}.bad{color:#a13d38}.muted{background:#f1edf7}.pill{display:inline-block;background:#e4f2e9;padding:7px 12px;border-radius:30px;font-size:13px}button:focus-visible{outline:3px solid #59449a}body{background:#fff6e9}h1,h2{font-family:Georgia,serif}main{max-width:760px}button{transition:transform .15s}button:active{transform:scale(.97)}.world{position:relative;overflow:hidden;border-radius:28px;background:#ccebdc;padding:18px;isolation:isolate}.world svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.places{display:grid;grid-template-columns:1fr 1fr;gap:24px 12px;padding:18px 0}.place{background:#fff9edee;box-shadow:0 5px 0 #365e4829;border:2px solid white;min-height:135px;text-align:center;padding:10px}.place:nth-child(even){transform:translateY(12px)}.place svg{position:static;width:100%;height:76px;display:block}.place b{display:block}.word{padding:3px 5px;min-height:35px;background:#f1e7ff;margin:2px;font-size:inherit}.word:active{background:#c8b4ee}nav{z-index:5}</style><main id="app"></main><nav><button onclick="home()">⌂ Início</button><button onclick="library()">▤ Fichas</button><button onclick="review()">↻ Revisão</button><button onclick="stats()">☆ Progresso</button></nav><script>const D=[["Am, is e are", "I am ready.", "Estou pronto."], ["Have e has", "She has a bicycle.", "Ela tem uma bicicleta."], ["Presente: rotina", "I walk to school every day.", "Vou a pé à escola todos os dias."], ["Do e does", "Does it open on Sundays?", "Abre aos domingos?"], ["Agora: verbo + ing", "We are waiting outside.", "Estamos esperando lá fora."], ["Rotina ou agora?", "I usually walk, but today I'm taking the bus.", "Normalmente vou a pé, mas hoje vou de ônibus."], ["Was e were", "We were at home yesterday.", "Estávamos em casa ontem."], ["Passado regular", "I finished early yesterday.", "Terminei cedo ontem."], ["Passado irregular", "She went to the library.", "Ela foi à biblioteca."], ["Did e didn't", "Did you enjoy the film?", "Você gostou do filme?"], ["Going to", "I'm going to study tonight.", "Vou estudar hoje à noite."], ["Will e won't", "I'll ring you later.", "Vou ligar para você mais tarde."], ["Can e can't", "I can speak a little English.", "Sei falar um pouco de inglês."], ["Pedidos educados", "Could you open the window, please?", "Poderia abrir a janela, por favor?"], ["Should e have to", "I have to catch the bus.", "Tenho que pegar o ônibus."], ["There is e there are", "There are two seats left.", "Restam dois lugares."], ["Perguntas com WH", "When does the shop close?", "Quando a loja fecha?"], ["Pronomes: eu e me", "She sent me a message.", "Ela me enviou uma mensagem."], ["Meu, seu e deles", "This jacket is mine.", "Esta jaqueta é minha."], ["This, that, these, those", "These books are new.", "Estes livros são novos."], ["In, on e at: lugar", "I'll meet you at the entrance.", "Vou encontrar você na entrada."], ["In, on e at: tempo", "The lesson starts at nine.", "A aula começa às nove."], ["Some, any, much, many", "Have you got any spare pens?", "Você tem alguma caneta sobrando?"], ["Comparar e escolher", "This route is quicker.", "Este caminho é mais rápido."], ["Present perfect", "I've already finished my homework.", "Já terminei minha lição."], ["For e since", "I've lived here since May.", "Moro aqui desde maio."], ["Ligar as ideias", "I was hungry, so I made a sandwich.", "Estava com fome, então fiz um sanduíche."], ["Cumprimentos", "How are things with you?", "Como vão as coisas com você?"], ["Apresentar-se", "I'm new around here.", "Sou novo por aqui."], ["Pedir para repetir", "Could you say that a bit more slowly?", "Poderia dizer isso um pouco mais devagar?"], ["Confirmar o entendimento", "Do you mean next Friday?", "Você quer dizer sexta-feira que vem?"], ["Agradecer", "Thanks a million for your help.", "Muito obrigado pela ajuda."], ["Desculpar-se", "Sorry for keeping you waiting.", "Desculpe por fazer você esperar."], ["Convidar alguém", "Do you fancy a walk?", "Está a fim de caminhar?"], ["Aceitar ou recusar", "I'd love to, but I'm busy today.", "Adoraria, mas estou ocupado hoje."], ["Gostos e preferências", "I'd rather stay indoors.", "Prefiro ficar dentro de casa."], ["Sentimentos", "I'm feeling much better today.", "Estou me sentindo bem melhor hoje."], ["Limites com respeito", "I'd prefer not to talk about that.", "Prefiro não falar sobre isso."], ["Apoiar um amigo", "I'm here if you need to talk.", "Estou aqui se precisar conversar."], ["Elogios naturais", "You did a great job.", "Você fez um ótimo trabalho."], ["WhatsApp: respostas", "I'll text you when I get there.", "Vou mandar mensagem quando chegar."], ["Ao telefone", "May I ask who's calling?", "Posso perguntar quem está falando?"], ["Problemas na ligação", "The line keeps cutting out.", "A ligação fica falhando."], ["Combinar e remarcar", "Could we meet on Saturday instead?", "Podemos nos encontrar no sábado em vez disso?"], ["Avisar um atraso", "I'm running a few minutes late.", "Estou alguns minutos atrasado."], ["Opiniões e acordos", "I see what you mean.", "Entendo o que você quer dizer."], ["Contar uma história", "At first, I didn't know what to say.", "No começo, não sabia o que dizer."], ["Pedir e oferecer ajuda", "Could you give me a hand with this?", "Poderia me ajudar com isto?"], ["Emprestar e devolver", "Can I borrow your pen for a minute?", "Posso pegar sua caneta emprestada por um minuto?"], ["Inglês informal irlandês", "That's grand, thanks.", "Está ótimo, obrigado."], ["Erros comuns do português", "I agree with you.", "Concordo com você."], ["Palavras que enganam", "Actually, I'm free tomorrow.", "Na verdade, estou livre amanhã."], ["Explicar uma palavra", "It's another word for a small bag.", "É outra palavra para uma bolsa pequena."], ["Manter a conversa", "What happened after that?", "O que aconteceu depois disso?"], ["Café da manhã", "I'd like porridge with fruit.", "Gostaria de mingau com frutas."], ["No café", "Could I get a tea to take away?", "Poderia pedir um chá para viagem?"], ["No restaurante", "Could we see the menu, please?", "Poderíamos ver o cardápio, por favor?"], ["Alimentos e restrições", "Is there any egg in this dish?", "Tem ovo neste prato?"], ["No supermercado", "Which aisle has the pasta?", "Em qual corredor fica o macarrão?"], ["Frutas e legumes", "Are these apples local?", "Estas maçãs são locais?"], ["Cozinhar", "The soup is nearly ready.", "A sopa está quase pronta."], ["Comprar roupa", "Have you got this in blue?", "Você tem isto em azul?"], ["Trocar e devolver", "Can I swap this for a different size?", "Posso trocar por outro tamanho?"], ["Dinheiro no dia a dia", "Is contactless payment available?", "Aceita pagamento por aproximação?"], ["Contas e aluguel", "When is the electricity bill due?", "Quando vence a conta de luz?"], ["Dividir a casa", "Shall we tidy the kitchen together?", "Vamos arrumar a cozinha juntos?"], ["Quarto e sala", "The lamp is beside the sofa.", "A luminária está ao lado do sofá."], ["Banheiro e lavanderia", "Is the washing machine free?", "A máquina de lavar está livre?"], ["Problemas na casa", "The heating isn't working.", "O aquecimento não está funcionando."], ["Rotina da manhã", "I get dressed before breakfast.", "Eu me visto antes do café da manhã."], ["Rotina da noite", "I set my alarm before bed.", "Programo meu despertador antes de dormir."], ["Clima e roupa", "It's chilly outside today.", "Está frio lá fora hoje."], ["Dias e datas", "My appointment is on the fifth of June.", "Minha consulta é em cinco de junho."], ["Horas em inglês", "It's a quarter past eight.", "São oito e quinze."], ["Direções na rua", "Is the library far from here?", "A biblioteca fica longe daqui?"], ["Pegar o ônibus", "Does this bus stop near the station?", "Este ônibus para perto da estação?"], ["Viagem de trem", "I'd like a single ticket to Cork.", "Gostaria de uma passagem só de ida para Cork."], ["Táxi e carona", "Could you drop me off at the station?", "Poderia me deixar na estação?"], ["Celular e internet", "What's the Wi-Fi password?", "Qual é a senha do Wi-Fi?"], ["Entregas e correio", "I'd like to post this letter.", "Gostaria de enviar esta carta pelo correio."], ["Lazer e fim de semana", "We're going to the park on Sunday.", "Vamos ao parque no domingo."], ["Falar sobre seu trabalho", "I enjoy working with people.", "Gosto de trabalhar com pessoas."], ["Disponibilidade e turnos", "I'm free on Monday afternoon.", "Estou livre na segunda à tarde."], ["Chegar ao trabalho", "Where should I leave my coat?", "Onde devo deixar meu casaco?"], ["Pedir orientação", "Could you explain the next step?", "Poderia explicar o próximo passo?"], ["Oferecer ajuda no cuidado", "Would you like me to bring your glasses?", "Gostaria que eu trouxesse seus óculos?"], ["Consentimento e privacidade", "Is it alright if I come in?", "Tudo bem se eu entrar?"], ["Conforto e ambiente", "Would you prefer the window closed?", "Prefere a janela fechada?"], ["Vestir-se e higiene", "Which jumper would you like to wear?", "Qual suéter gostaria de vestir?"], ["Refeições no cuidado", "Would you prefer tea or water?", "Prefere chá ou água?"], ["Mobilidade: comunicação", "Please tell me if you feel uncomfortable.", "Por favor, diga se sentir desconforto."], ["Observar e relatar", "I'll let the nurse know.", "Vou avisar a enfermeira."], ["Passagem de turno", "She was awake when I arrived.", "Ela estava acordada quando cheguei."], ["Equipe e cooperação", "Let's check with the team first.", "Vamos confirmar com a equipe primeiro."], ["RH e documentos", "Which documents do you need?", "De quais documentos você precisa?"], ["Entrevista de emprego", "I'm keen to learn new skills.", "Tenho vontade de aprender novas habilidades."], ["Escrever um e-mail", "Thank you for getting back to me.", "Obrigado por me responder."], ["Marcar uma consulta", "Is there an appointment available next week?", "Há uma consulta disponível na próxima semana?"], ["Explicar sintomas", "I've had a sore throat since yesterday.", "Estou com dor de garganta desde ontem."], ["Na farmácia", "Could I speak to the pharmacist?", "Poderia falar com o farmacêutico?"], ["Corpo e sensações", "My left shoulder feels stiff.", "Meu ombro esquerdo está rígido."], ["Pedir ajuda urgente", "Please call for medical help.", "Por favor, chame ajuda médica."], ["No aeroporto", "Where is the departure gate?", "Onde fica o portão de embarque?"], ["No hotel", "Is there a room available tonight?", "Há um quarto disponível hoje à noite?"], ["Formulários e cadastros", "Do I need to sign here?", "Preciso assinar aqui?"], ["Perdidos e achados", "Has anyone handed in a blue bag?", "Alguém entregou uma bolsa azul?"], ["Verbos com partículas", "I'll look up the address.", "Vou pesquisar o endereço."], ["Praticar a memória", "I can remember it without looking.", "Consigo lembrar sem olhar."]];const V=['Gramática essencial','Conversas e conexões','Vida diária','Trabalho e serviços'];let S={cards:{},xp:0,days:[],errors:0},storage=true;try{S=JSON.parse(localStorage.getItem('englishUnlockV1'))||S}catch(e){storage=false}const A=document.getElementById('app');let id=0,mode='flash',locked=false,queue=[],pos=0,words=[],picked=[];const day=()=>new Date().toLocaleDateString('en-CA');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('englishUnlockV1',JSON.stringify(S))}catch(e){storage=false}}function due(){return Object.keys(S.cards).map(Number).filter(i=>S.cards[i].due<=Date.now())}function count(){return Object.values(S.cards).filter(c=>c.level>0).length}function home(){A.innerHTML=`<small>ENGLISH UNLOCK · A1 → B1</small><h1>Seu inglês, um passo por vez.</h1><p>Pratique 3 frases hoje. Ouça, fale e tente lembrar.</p><section style="background:#e8dff8"><span class="pill">${S.xp} XP · ${count()}/108 fichas</span><h2>Missão diária</h2><div class="bar"><b style="width:${count()/108*100}%"></b></div><p>${due().length} revisões disponíveis</p><button class="primary" onclick="daily()">Começar missão</button></section><div class="grid">${V.map((v,i)=>`<button style="background:${['#e8dff8','#dcefe3','#dcebf9','#f9e4d4'][i]}" onclick="library(${i})">Volume ${i+1}<br><b>${v}</b></button>`).join('')}<button onclick="start([95,81,82],'type')">Entrevista · treino</button><button onclick="start([29,49,92],'order')">Jogo de palavras</button></div><section><small>Base: quatro volumes Inglês Ilustrado. 108 temas, uma frase original por tema. Revisão em 1, 3, 7 e 14 dias. Áudio sintetizado pelo dispositivo.</small></section>${storage?'':'<p class="bad">Armazenamento indisponível: exporte seu progresso.</p>'}`}
function daily(){let fresh=D.map((_,i)=>i).filter(i=>!S.cards[i]||!S.cards[i].level);let q=[...due(),...fresh].slice(0,3);start(q.length?q:[0,27,54],'flash')}
function library(v=-1){A.innerHTML=`<h1>Biblioteca</h1><select id="vol" onchange="library(+this.value)"><option value="-1">Todos os volumes</option>${V.map((x,i)=>`<option value="${i}" ${v===i?'selected':''}>${x}</option>`).join('')}</select><p><input placeholder="Buscar tema" oninput="filter(this.value)"></p><div class="stack" id="items">${D.map((d,i)=>v<0||Math.floor(i/27)===v?`<button data-name="${esc(d[0].toLowerCase())}" onclick="start([${i}],'flash')" style="text-align:left">${String(i+1).padStart(3,'0')} · ${esc(d[0])} ${S.cards[i]?.level?'✓':''}</button>`:'').join('')}</div>`}function filter(s){document.querySelectorAll('#items button').forEach(b=>b.hidden=!b.dataset.name.includes(s.toLowerCase()))}function start(q,m){queue=q;pos=0;mode=m;show()}function review(){let q=due();if(q.length)start(q,'type');else A.innerHTML='<h1>Revisão</h1><section>Nenhuma revisão vencida. Volte amanhã ou pratique livremente.</section><button onclick="daily()">Praticar agora</button>'}function speak(){if(!('speechSynthesis'in window)){alert('Áudio indisponível neste navegador.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(D[id][1]);let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-IE')||voices.find(v=>v.lang==='en-GB')||null;u.lang=u.voice?.lang||'en-IE';u.rate=.83;speechSynthesis.speak(u)}function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function show(){id=queue[pos];locked=false;picked=[];let d=D[id];words=shuffle(d[1].split(' ').map((w,i)=>({w,i})));A.innerHTML=`<small>Ficha ${id+1} · ${pos+1}/${queue.length} · ${V[Math.floor(id/27)]}</small><h2>${esc(d[0])}</h2><div class="grid"><button onclick="mode='flash';show()">Memória</button><button onclick="mode='quiz';show()">Quiz</button><button onclick="mode='type';show()">Escrita</button><button onclick="mode='order';show()">Ordenar</button></div><section><small>TRADUÇÃO</small><p class="phrase">${esc(d[2])}</p><button onclick="speak()">▶ Ouvir inglês</button><div id="exercise"></div><div id="feedback" aria-live="polite"></div></section>`;let E=document.getElementById('exercise');if(mode==='flash')E.innerHTML='<p>Diga em inglês antes de revelar.</p><button class="primary" onclick="reveal()">Revelar frase</button>';if(mode==='type')E.innerHTML='<p>Escreva a frase em inglês.</p><input id="ans" autocomplete="off" autocapitalize="off"><p><button class="primary" onclick="check(document.getElementById(&quot;ans&quot;).value)">Conferir</button></p>';if(mode==='quiz'){let opts=shuffle([id,...shuffle(D.map((_,i)=>i).filter(i=>i!==id)).slice(0,3)]);E.innerHTML='<p>Escolha a tradução em inglês:</p><div class="stack">'+opts.map(i=>`<button onclick="check(D[${i}][1])">${esc(D[i][1])}</button>`).join('')+'</div>'}if(mode==='order'){E.innerHTML='<p>Monte a frase:</p><p id="picked" class="muted" style="padding:12px;min-height:48px"></p><div id="words"></div><p><button onclick="picked=[];renderWords()">Limpar</button> <button onclick="check(picked.map(i=>words[i].w).join(&quot; &quot;))">Conferir</button></p>';renderWords()}}
function renderWords(){document.getElementById('picked').textContent=picked.map(i=>words[i].w).join(' ');document.getElementById('words').innerHTML=words.map((x,i)=>`<button style="margin:3px" ${picked.includes(i)?'disabled':''} onclick="picked.push(${i});renderWords()">${esc(x.w)}</button>`).join('')}function reveal(){document.getElementById('exercise').innerHTML=`<p class="phrase">${esc(D[id][1])}</p><p>Você conseguiu lembrar?</p><div class="grid"><button onclick="finish(false)">Ainda não</button><button onclick="finish(true)">Consegui!</button></div>`}const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim();function check(s){if(!locked)finish(norm(s)===norm(D[id][1]))}function finish(ok){if(locked)return;locked=true;let c=S.cards[id]||{level:0,attempts:0};c.attempts++;c.level=ok?Math.min(4,c.level+1):0;c.due=Date.now()+([1,1,3,7,14][c.level])*86400000;S.cards[id]=c;S.xp+=ok?10:2;if(!ok)S.errors++;if(!S.days.includes(day()))S.days.push(day());save();document.getElementById('exercise').innerHTML='';document.getElementById('feedback').innerHTML=`<p class="${ok?'ok':'bad'}"><b>${ok?'Muito bem! +10 XP':'Continue tentando! +2 XP'}</b></p><p class="phrase">${esc(D[id][1])}</p><small>${ok?'Próxima revisão: '+[1,1,3,7,14][c.level]+' dia(s).':'Revise amanhã. Outras traduções também podem ser válidas.'}</small><p><button class="primary" onclick="next()">${pos+1<queue.length?'Próxima frase':'Concluir'}</button></p>`}function next(){if(++pos<queue.length)show();else A.innerHTML=`<h1>Missão concluída!</h1><section style="background:#dcefe3"><h2>Good work!</h2><p>${queue.length} frases praticadas · ${S.xp} XP acumulados.</p><button class="primary" onclick="home()">Voltar ao início</button></section>`}function stats(){A.innerHTML=`<h1>Meu progresso</h1><section><h2>${S.xp} XP</h2><p>${count()} de 108 fichas lembradas · ${S.days.length} dias de prática · ${S.errors} tentativas a revisar</p>${V.map((v,i)=>{let n=D.slice(i*27,i*27+27).filter((_,j)=>S.cards[i*27+j]?.level>0).length;return `<p>${v} · ${n}/27</p><div class="bar"><b style="width:${n/27*100}%"></b></div>`}).join('')}</section><section><button onclick="backup()">Exportar progresso</button><p><label>Importar progresso <input type="file" accept="application/json,.json" onchange="restore(this.files[0])"></label></p><small>O progresso fica neste navegador, quando o armazenamento local está disponível. Guarde uma cópia.</small></section>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='english-unlock-progresso.json';a.click()}async function restore(f){if(!f)return;try{let x=JSON.parse(await f.text());if(!x.cards||!Array.isArray(x.days)||!Number.isFinite(x.xp)||!Number.isFinite(x.errors)||Object.entries(x.cards).some(([i,c])=>!Number.isInteger(+i)||+i<0||+i>=108||!Number.isFinite(c.due)||!Number.isInteger(c.level)||c.level<0||c.level>4||!Number.isFinite(c.attempts)))throw Error();S=x;save();stats()}catch(e){alert('Arquivo de progresso inválido.')}}home();const places=[['Grammar Garden','Gramática','#c6b5ef',0,'garden'],['Cat Chat Café','Conversação','#ffc4a8',1,'cafe'],['Little Dublin','Vida diária','#a7d8ef',2,'town'],['Care Village','Trabalho e serviços','#f6c2d9',3,'care'],['Listening Cottage','Escuta','#ffe0a0',4,'house'],['Challenge Castle','Jogos','#b9c5fa',5,'castle'],['My Practice','Vocabulário e revisão','#b9e4c5',6,'book']];

function audio(t,lang,rate){if(!window.speechSynthesis)return alert('Áudio indisponível');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.voice=speechSynthesis.getVoices().find(v=>v.lang===lang)||null;u.rate=rate;speechSynthesis.speak(u)}
speak=function(){audio(D[id][1],'en-GB',1)};

home();const fallbackHome=home;home=function(){fallbackHome();const img=new Image();img.onload=()=>{if(!document.querySelector('.world'))return;const points=[[7,47,21,20,1,'Cat Chat Café'],[30,47,21,20,0,'Grammar Garden'],[53,47,22,20,3,'Care Village'],[76,47,23,22,2,'Little Dublin'],[17,67,21,19,4,'Listening Cottage'],[40,67,21,19,5,'Challenge Castle'],[63,67,21,19,6,'My Practice']];A.innerHTML='<div style="position:relative"><img src="world.jpg" alt="English Unlock — mapa ilustrado" style="display:block;width:100%;border-radius:18px"><div style="position:absolute;top:1%;right:1%;width:13%;height:7%;background:#fff9ed;border-radius:12px;display:grid;place-items:center;font-size:clamp(9px,2.5vw,16px);font-weight:bold">A2–B1<br>'+S.xp+' XP</div>'+points.map(p=>'<button aria-label="'+p[5]+'" onclick="go('+p[4]+')" style="position:absolute;left:'+p[0]+'%;top:'+p[1]+'%;width:'+p[2]+'%;height:'+p[3]+'%;background:transparent;border:0;padding:0"></button>').join('')+['home()','library()','go(5)','review()','vocab()','stats()','stats()','settings()'].map((a,i)=>'<button aria-label="'+['Início','Aulas','Jogos','Revisão','Palavras','Progresso','Conquistas','Configurações'][i]+'" onclick="'+a+'" style="position:absolute;left:'+(i*12.5)+'%;top:90%;width:12.5%;height:10%;background:transparent;padding:0"></button>').join('')+'</div><button class="primary" onclick="daily()" style="margin-top:12px">Missão diária · 3 frases</button>';};img.src='world.jpg'};function settings(){A.innerHTML='<h1>Configurações</h1><section><p>Áudio: inglês britânico e português brasileiro, conforme vozes disponíveis.</p><button onclick="audio(&quot;Welcome to English Unlock&quot;,&quot;en-GB&quot;,1)">Testar inglês</button><button onclick="backup()">Exportar progresso</button></section>'}home();</script></html>
